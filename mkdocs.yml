site_name: WEC-Grid
site_description: Integrating Wave Energy Converter Models into Power System Simulations
repo_url: https://github.com/acep-uaf/WEC-Grid
theme:
  name: windmill
  logo: assets/WEC-Grid_logo.png     # Main site logo
  nav_style: dark

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css


extra:
  logo: assets/WEC-Grid_mini_white_circle.png
  version: 1.0.0
  history_buttons: True
  article_nav_top: True
  article_nav_bottom: True

plugins:
  - search


  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            filters:
              - "!^_"        # Exclude private methods
              - "!^test_"    # Exclude test functions
  - mkdocs-jupyter:
      include: ["*.ipynb"] 
      execute: False
      include_source: True
nav:
  - Home: index.md
  - Getting Started:
      - Software Design: design.md
      - Installation: install.md
  - WEC-Grid:
    - Engine: wecgrid/engine.md
    - Modelers:
      - Power System:
        - Base: wecgrid/base.md
        - Grid State: wecgrid/grid.md
        - PSS/E: wecgrid/psse.md
        - PyPSA: wecgrid/pypsa.md
      - WEC-Sim:
        - Runner: wecgrid/wecsim.md
    - WEC:
      - WEC Module: wecgrid/wec.md
      - WEC Farm: wecgrid/wec_farm.md
      - WEC Device: wecgrid/wec_device.md
    - Util:
      - Database: wecgrid/database.md
      - Time: wecgrid/time.md
      - Plot: wecgrid/plot.md
  - Examples & Data:
    - Jupyter notebooks:
      - Example 1: examples/jupyter_notebooks/example1.ipynb
      - Example 2: examples/jupyter_notebooks/example2.ipynb
      - Example 3: examples/jupyter_notebooks/example3.ipynb
      - Example 4: examples/jupyter_notebooks/example4.ipynb
    - Data:
      - Grid Models: examples/data/grid-models.md
      - WEC Models: examples/data/wec-models.md
      - Database: examples/data/database.md
  - Reference:
      - Performance Metrics: reference/performance_metrics.md
      - Troubleshooting: reference/troubleshooting.md
      - Citation: reference/citation.md
