[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marinegrid"
version = "2.0.0"
description = "Marine-Grid: A tool for integrating marine renewable energy models into power system simulations"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Alexander Barajas-Ritchie", email = "barajale@oregonstate.edu"}]
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=2.0",
    "matplotlib>=3.6",
    "pypsa>=0.26",
    "grg-pssedata>=0.1.0",
    "networkx>=3.0",
    "pyomo>=6.5",
    "tqdm>=4.60",
    "jupyter>=1.0",
    "mkdocstrings-python>=1.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/acep-uaf/Marine-Grid"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marinegrid = [
    "py.typed",
    "util/*.json",
    "modeler/wecsim/*.json",
]
